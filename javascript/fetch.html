<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>
    <style>
        * {
            background-color: #f0f0f0;

        }
        img{
            width:100px;
            height:100px;
        }
        table {
            /* border-collapse: collapse; */
            width: 100%;
            margin: auto;
            padding: 10px;
            font-size: 25px;
            color: red;
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>title</th>
                <th>image</th>
                <th>category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>
    <script>
        const ele=document.getElementById("data");
        const URL="https://dummyjson.com/products";
        async function loadData(){
            try{
                const res= await fetch(URL);
                const data= await res.json();
                console.log("Data",data.products);
                let row="";
                data.products.map((i,index) => {
                    row+=`
                    
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src="${i.images[0]}"/></td>
                        <td>${i.category}</td>
                        <td>${i.Price}</td>
                    </tr>
                    
                    `;
                    ele.innerHTML=row;


                })



            }
            catch(err){
                console.log("ERROR",err);
            }


        }
        loadData();
    </script>
</body>
</html>
